services:
  - type: web
    name: toolvault-pdf-to-word
    runtime: docker
    rootDir: pdf-to-word-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://toolvault.aftabjordan1.workers.dev
      - key: MAX_UPLOAD_MB
        value: "25"
